name: Build PrivateMediaVault Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'plugins/**') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck and unit tests
        run: |
          npm run typecheck
          npm test

      - name: Generate native Android project (Expo Prebuild)
        env:
          EXPO_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}
        run: npx expo prebuild --platform android --non-interactive

      - name: Build Standalone Signed APK (arm64-v8a)
        working-directory: android
        env:
          EXPO_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrivateMediaVault-APK
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release for In-App Updater
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Sürüm 1.0.${{ github.run_number }}
          body: İmzalı ve bağımsız Android APK (arm64-v8a) sürümü.
          files: android/app/build/outputs/apk/release/app-release.apk
